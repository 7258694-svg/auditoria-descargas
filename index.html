<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auditoría de Descarga - Control de Evidencias</title>
    <!-- Librerías para exportar a Word -->
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --success: #10b981;
            --whatsapp: #25d366;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); padding: 12px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; }

        .app-header { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: white; padding: 18px; border-radius: 16px; text-align: center; box-shadow: 0 4px 12px rgba(30, 58, 138, 0.15); }
        .app-header h1 { font-size: 20px; font-weight: 700; }
        .app-header p { font-size: 12px; opacity: 0.85; margin-top: 4px; }

        .card { background: var(--card-bg); border-radius: 16px; padding: 16px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .card-title { font-size: 13px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; margin-bottom: 10px; }

        .input-control { width: 100%; padding: 12px 14px; font-size: 15px; font-weight: 600; border: 2px solid var(--border); border-radius: 10px; outline: none; transition: all 0.2s; text-transform: uppercase; }
        .input-control:focus { border-color: var(--primary-light); }

        .camera-container { position: relative; width: 100%; height: 220px; background: #0f172a; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #334155; }
        .camera-preview { width: 100%; height: 100%; object-fit: cover; display: none; }
        .camera-placeholder { color: #94a3b8; text-align: center; font-size: 13px; padding: 20px; }
        .camera-placeholder svg { width: 48px; height: 48px; fill: #64748b; margin-bottom: 8px; }

        .btn-camera-trigger { width: 100%; background: var(--primary-light); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }

        .counters-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .counter-card { background: #f1f5f9; padding: 10px; border-radius: 10px; text-align: center; border: 1px solid #e2e8f0; }
        .counter-card label { font-size: 11px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 6px; }
        .counter-input { width: 100%; text-align: center; font-size: 18px; font-weight: 700; padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px; background: white; color: var(--primary); }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-save { background-color: var(--primary); color: white; }
        .btn-export { background-color: var(--success); color: white; }
        .btn-whatsapp { background-color: var(--whatsapp); color: white; }

        .actions-group { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }

        .history-list { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .history-item { background: #f8fafc; border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #e0e7ff; color: #3730a3; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <h1>Auditoría de Descarga</h1>
        <p>Control de Evidencias e Inspección de Mulas</p>
    </div>

    <div class="card">
        <div class="card-title">Datos del Vehículo</div>
        <input type="text" id="placa" class="input-control" placeholder="Placa Mula (Ej: SZN-397)">
    </div>

    <div class="card" style="text-align: center;">
        <div class="card-title" style="text-align: left;">Evidencia Fotográfica</div>
        
        <div class="camera-container">
            <div class="camera-placeholder" id="placeholder">
                <svg viewBox="0 0 24 24"><path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2m8 3a5 5 0 0 0-5 5a5 5 0 0 0 5 5a5 5 0 0 0 5-5a5 5 0 0 0-5-5m0 2a3 3 0 0 1 3 3a3 3 0 0 1-3 3a3 3 0 0 1-3-3a3 3 0 0 1 3-3Z"/></svg>
                <p>Sin evidencia capturada</p>
            </div>
            <img id="preview" class="camera-preview" alt="Vista previa">
        </div>

        <!-- Input file nativo directo -->
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="handleImageCapture(event)">
        
        <button type="button" class="btn-camera-trigger" onclick="openCamera()">
            📷 TOMAR FOTO / SELECCIONAR
        </button>
    </div>

    <div class="card">
        <div class="card-title">Conteo de Descarga</div>
        <div class="counters-grid">
            <div class="counter-card">
                <label>C. GRANDES</label>
                <input type="number" id="cGrandes" class="counter-input" value="0" min="0">
            </div>
            <div class="counter-card">
                <label>C. MEDIANAS</label>
                <input type="number" id="cMedianas" class="counter-input" value="0" min="0">
            </div>
            <div class="counter-card">
                <label>C. PEQUEÑAS</label>
                <input type="number" id="cPequenas" class="counter-input" value="0" min="0">
            </div>
            <div class="counter-card">
                <label>ESTIBAS</label>
                <input type="number" id="estibas" class="counter-input" value="0" min="0">
            </div>
        </div>
    </div>

    <button type="button" class="btn btn-save" onclick="guardarRegistro()">
        💾 GUARDAR REGISTRO FOTOGRÁFICO
    </button>

    <div class="card">
        <div class="card-title" style="display: flex; justify-content: space-between;">
            <span>Registros Guardados</span>
            <span class="badge" id="regCount">0</span>
        </div>
        <div class="history-list" id="history">
            <p style="font-size: 12px; color: var(--text-muted); text-align: center; padding: 10px;">No hay fotos registradas para este reporte.</p>
        </div>
    </div>

    <div class="actions-group">
        <button type="button" class="btn btn-export" onclick="generarWord()">
            📄 DESCARGAR INFORME WORD (.DOCX)
        </button>
        <button type="button" class="btn btn-whatsapp" onclick="compartirWhatsApp()">
            💬 ENVIAR REPORTE POR WHATSAPP
        </button>
    </div>
</div>

<script>
    let photoDataOptimized = null;
    let registros = [];

    function openCamera() {
        const fileInput = document.getElementById('cameraInput');
        fileInput.value = ''; // Limpiar selección previa
        fileInput.click();
    }

    function handleImageCapture(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const scaleSize = MAX_WIDTH / img.width;
                    
                    canvas.width = (img.width > MAX_WIDTH) ? MAX_WIDTH : img.width;
                    canvas.height = (img.width > MAX_WIDTH) ? img.height * scaleSize : img.height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    photoDataOptimized = canvas.toDataURL('image/jpeg', 0.7);

                    document.getElementById('preview').src = photoDataOptimized;
                    document.getElementById('preview').style.display = 'block';
                    document.getElementById('placeholder').style.display = 'none';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    function guardarRegistro() {
        if (!photoDataOptimized) {
            alert("⚠️ Por favor toma o selecciona una foto antes de guardar el registro.");
            return;
        }

        const registro = {
            foto: photoDataOptimized,
            grandes: parseInt(document.getElementById('cGrandes').value) || 0,
            medianas: parseInt(document.getElementById('cMedianas').value) || 0,
            pequenas: parseInt(document.getElementById('cPequenas').value) || 0,
            estibas: parseInt(document.getElementById('estibas').value) || 0,
            hora: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        registros.push(registro);
        actualizarHistorico();

        document.getElementById('cGrandes').value = 0;
        document.getElementById('cMedianas').value = 0;
        document.getElementById('cPequenas').value = 0;
        document.getElementById('estibas').value = 0;
        document.getElementById('preview').style.display = 'none';
        document.getElementById('placeholder').style.display = 'block';
        photoDataOptimized = null;

        alert("✅ Registro guardado con éxito.");
    }

    function actualizarHistorico() {
        const historyDiv = document.getElementById('history');
        document.getElementById('regCount').innerText = registros.length;

        if (registros.length === 0) {
            historyDiv.innerHTML = '<p style="font-size: 12px; color: var(--text-muted); text-align: center; padding: 10px;">No hay fotos registradas para este reporte.</p>';
            return;
        }

        let html = '';
        registros.forEach((r, idx) => {
            html += `<div class="history-item">
                <span><strong>#${idx + 1}</strong> (${r.hora})</span>
                <span>G: <strong>${r.grandes}</strong> \vert{} M: <strong>${r.medianas}</strong> | P: <strong>${r.pequenas}</strong> \vert{} Est: <strong>${r.estibas}</strong></span>
            </div>`;
        });
        historyDiv.innerHTML = html;
    }

    async function crearDocumento() {
        const placa = document.getElementById('placa').value.toUpperCase() || "SIN_PLACA";
        const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, ImageRun, AlignmentType, WidthType, ShadingType } = docx;

        let totG = 0, totM = 0, totP = 0, totEst = 0;
        registros.forEach(r => { totG += r.grandes; totM += r.medianas; totP += r.pequenas; totEst += r.estibas; });

        let docChildren = [
            new Paragraph({
                children: [new TextRun({ text: "INFORME DE AUDITORÍA Y EVIDENCIA DE DESCARGA", bold: true, size: 28, color: "1E3A8A" })],
                alignment: AlignmentType.CENTER,
                spaceAfter: 300
            }),
            new Paragraph({
                children: [new TextRun({ text: "Placa del Vehículo: ", bold: true, size: 22 }), new TextRun({ text: placa, size: 22 })],
                alignment: AlignmentType.CENTER
            }),
            new Paragraph({
                children: [new TextRun({ text: "Fecha y Hora: ", bold: true, size: 20 }), new TextRun({ text: `${new Date().toLocaleDateString()} -${new Date().toLocaleTimeString()}`, size: 20 })],
                alignment: AlignmentType.CENTER,
                spaceAfter: 400
            }),
            new Paragraph({
                children: [new TextRun({ text: "CONSOLIDADO TOTAL DESCARGADO", bold: true, size: 22, color: "1E3A8A" })],
                alignment: AlignmentType.CENTER,
                spaceAfter: 200
            }),
            new Table({
                alignment: AlignmentType.CENTER,
                width: { size: 90, type: WidthType.PERCENTAGE },
                rows: [
                    new TableRow({
                        children: [
                            new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Cubetas Grandes", bold: true, color: "FFFFFF" })], alignment: AlignmentType.CENTER })], shading: { fill: "1E3A8A", type: ShadingType.CLEAR } }),
                            new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Cubetas Medianas", bold: true, color: "FFFFFF" })], alignment: AlignmentType.CENTER })], shading: { fill: "1E3A8A", type: ShadingType.CLEAR } }),
                            new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Cubetas Pequeñas", bold: true, color: "FFFFFF" })], alignment: AlignmentType.CENTER })], shading: { fill: "1E3A8A", type: ShadingType.CLEAR } }),
                            new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Total Estibas", bold: true, color: "FFFFFF" })], alignment: AlignmentType.CENTER })], shading: { fill: "1E3A8A", type: ShadingType.CLEAR } })
                        ]
                    }),
                    new TableRow({
                        children: [
                            new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: totG.toString(), bold: true, size: 24 })], alignment: AlignmentType.CENTER })] }),
                            new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: totM.toString(), bold: true, size: 24 })], alignment: AlignmentType.CENTER })] }),
                            new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: totP.toString(), bold: true, size: 24 })], alignment: AlignmentType.CENTER })] }),
                            new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: totEst.toString(), bold: true, size: 24 })], alignment: AlignmentType.CENTER })] })
                        ]
                    })
                ]
            }),
            new Paragraph({ text: "", spaceAfter: 500 }),
            new Paragraph({
                children: [new TextRun({ text: "EVIDENCIAS FOTOGRÁFICAS DETALLADAS", bold: true, size: 22, color: "1E3A8A" })],
                alignment: AlignmentType.CENTER,
                spaceAfter: 300
            })
        ];

        for (let i = 0; i < registros.length; i++) {
            const r = registros[i];
            const base64Data = r.foto.split(',')[1];

            docChildren.push(
                new Paragraph({
                    children: [
                        new TextRun({ text: `Registro #${i + 1} (${r.hora}) - `, bold: true, size: 20 }),
                        new TextRun({ text: `Grandes: ${r.grandes} \vert{} Medianas:${r.medianas} | Pequeñas: ${r.pequenas} \vert{} Estibas:${r.estibas}`, size: 20 })
                    ],
                    alignment: AlignmentType.CENTER,
                    spaceAfter: 150
                }),
                new Paragraph({
                    children: [
                        new ImageRun({
                            data: Uint8Array.from(atob(base64Data), c => c.charCodeAt(0)),
                            transformation: { width: 360, height: 270 }
                        })
                    ],
                    alignment: AlignmentType.CENTER,
                    spaceAfter: 400
                })
            );
        }

        const doc = new Document({ sections: [{ children: docChildren }] });
        return { blob: await Packer.toBlob(doc), placa, totG, totM, totP, totEst };
    }

    async function generarWord() {
        if (registros.length === 0) {
            alert("⚠️ No hay registros capturados para exportar.");
            return;
        }
        const { blob, placa } = await crearDocumento();
        saveAs(blob, `Auditoria_Mula_${placa}.docx`);
    }

    async function compartirWhatsApp() {
        if (registros.length === 0) {
            alert("⚠️ No hay registros para compartir.");
            return;
        }

        const { blob, placa, totG, totM, totP, totEst } = await crearDocumento();
        const archivo = new File([blob], `Auditoria_Mula_${placa}.docx`, { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });

        const textoMensaje = `📋 *REPORTE DE AUDITORÍA DE DESCARGA*\n` +
            `🚛 *Placa:* ${placa}\n` +
            `📅 *Fecha:* ${new Date().toLocaleDateString()}\n\n` +
            `📦 *RESUMEN DE TOTALES:*\n` +
            `• Cubetas Grandes: ${totG}\n` +
            `• Cubetas Medianas: ${totM}\n` +
            `• Cubetas Pequeñas: ${totP}\n` +
            `• Total Estibas: ${totEst}\n
